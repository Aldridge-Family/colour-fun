<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff6fae">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Colour Fun</title>
<style>
:root{--bg:#fdf6fb;--ink:#3a2e39;--muted:#8a7d89;--card:#fff;--accent:#ff6fae;--bar:#f3eef5;--shadow:0 6px 18px rgba(80,40,90,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
/* who */
.who{align-items:center;justify-content:center;gap:30px;background:linear-gradient(160deg,#ffe3f1,#e9e2ff 55%,#dcf3ff);padding:20px}
.who h1{font-size:clamp(34px,5.5vw,60px);margin:0;letter-spacing:.5px}
.kids{display:flex;gap:clamp(20px,5vw,70px);flex-wrap:wrap;justify-content:center}
.kid{border:0;background:#fff;border-radius:40px;padding:26px 38px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.kid:active{transform:scale(.95)}
.kid svg{width:clamp(150px,22vw,250px);height:auto;border-radius:50%;background:#fff3f9}
.kid b{font-size:clamp(30px,4.2vw,48px)}
.kid small{font-size:18px;color:var(--muted)}
/* library */
.top{display:flex;align-items:center;gap:14px;padding:14px 18px 4px}
.top .sp{flex:1}
.me{display:flex;align-items:center;gap:12px;border:0;background:#fff;border-radius:44px;padding:6px 22px 6px 6px;box-shadow:var(--shadow);font-size:26px;font-weight:800}
.me svg{width:58px;height:58px;border-radius:50%;background:#fff3f9}
.round{width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:26px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:12px 18px 14px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar,.pal::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:30px;padding:12px 22px;font-size:21px;font-weight:800;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tab.on{background:var(--accent);color:#fff}
.grid{flex:1;overflow-y:auto;padding:4px 18px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;align-content:start}
.card{position:relative;border:0;padding:0;background:#fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;aspect-ratio:1;transition:transform .15s}
.card:active{transform:scale(.96)}
.card svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:10px;right:12px;font-weight:900;font-size:17px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.92)}
.tag.new{color:#ff4d6d}.tag.go{color:#7a4dff}.tag.done{background:#38c172;color:#fff}
.lvl{position:absolute;top:10px;left:12px;font-size:17px;background:rgba(255,255,255,.92);border-radius:20px;padding:3px 9px}
.nm{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 10px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.96) 55%);font-weight:800;font-size:19px;text-align:center}
.empty{grid-column:1/-1;text-align:center;font-size:24px;color:var(--muted);padding:60px 20px}
/* paint */
.paint{background:#fff}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;font-family:inherit}
.fab{position:absolute;width:66px;height:66px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;z-index:5;padding:0}
.fab svg{width:34px;height:34px}
.fab.back{top:16px;left:16px}.fab.hint{top:16px;right:16px;font-size:32px}.fab.fit{right:16px;bottom:16px}
.pal{flex:none;background:var(--bar);display:flex;gap:14px;overflow-x:auto;padding:20px 22px 16px;scrollbar-width:none;min-height:122px;align-items:center}
.sw{flex:none;width:80px;height:80px;border-radius:50%;padding:0;border:0;background:transparent;display:grid;place-items:center;transition:transform .2s,width .4s,margin .4s,opacity .4s,padding .2s}
.sw i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font-style:normal;font-size:31px;font-weight:900;box-shadow:inset 0 -4px 0 rgba(0,0,0,.13)}
.sw.on{transform:translateY(-10px) scale(1.14);padding:6px;background:conic-gradient(var(--ink) var(--p,0deg),#d9d3dc 0)}
.sw.gone{width:0;opacity:0;transform:scale(0);margin-right:-14px}
.sw.nudge{animation:nudge .7s}
@keyframes nudge{0%,100%{translate:0 0}20%{translate:0 -18px}45%{translate:0 0}65%{translate:0 -9px}}
.rg{transition:fill .25s}
.lb{font-weight:800;fill:#3a3a3a;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.pulse{fill:none;stroke:#ff3d8b;pointer-events:none;animation:blink 1.8s ease-out forwards}
@keyframes blink{0%,30%,60%{opacity:1}15%,45%{opacity:.15}100%{opacity:0}}
.ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:5px solid var(--c);animation:rip .5s ease-out forwards;pointer-events:none;z-index:4}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* overlays */
.over{position:fixed;inset:0;background:rgba(255,240,248,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:20;text-align:center;padding:20px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.over h2{font-size:clamp(30px,5vw,54px);margin:0}
.over .big{width:min(58vh,80vw);aspect-ratio:1;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.over .big svg{width:100%;height:100%;display:block}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:44px;padding:16px 30px;font-size:23px;font-weight:800;background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.btn.alt{background:#fff;color:var(--ink)}
.conf{position:fixed;top:-24px;width:13px;height:19px;border-radius:3px;animation:fall linear forwards;z-index:21;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:30px;font-size:20px;font-weight:700;z-index:30;animation:fade .2s}
</style>
</head>

<div id="app"></div>
<script>
'use strict';
/* ================= shape helpers (600 x 600 picture space) ================= */
const f=n=>Math.round(n*10)/10;
function E(cx,cy,rx,ry,deg=0){const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);const x1=f(cx+rx*c),y1=f(cy+rx*s),x2=f(cx-rx*c),y2=f(cy-rx*s);return `M${x1} ${y1}A${rx} ${ry} ${deg} 1 0 ${x2} ${y2}A${rx} ${ry} ${deg} 1 0 ${x1} ${y1}Z`;}
const C=(cx,cy,r)=>E(cx,cy,r,r);
function R(x,y,w,h,r=0){if(!r)return `M${x} ${y}H${x+w}V${y+h}H${x}Z`;r=Math.min(r,w/2,h/2);return `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`;}
function P(...p){let d=`M${p[0]} ${p[1]}`;for(let i=2;i<p.length;i+=2)d+=`L${p[i]} ${p[i+1]}`;return d+'Z';}
function STAR(cx,cy,r,n=5,inner=.45,rot=-90){const a=[];for(let i=0;i<n*2;i++){const rr=i%2?r*inner:r,t=(rot+i*180/n)*Math.PI/180;a.push(f(cx+rr*Math.cos(t)),f(cy+rr*Math.sin(t)));}return P(...a);}
/* scalloped outline (clouds, flowers, bushes) */
function SC(cx,cy,rx,ry,n,k=.62,rot=-90){const pts=[];for(let i=0;i<n;i++){const t=(rot+i*360/n)*Math.PI/180;pts.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)]);}let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];const r=f(Math.hypot(b[0]-a[0],b[1]-a[1])*k);d+=`A${r} ${r} 0 0 1 ${f(b[0])} ${f(b[1])}`;}return d+'Z';}
const FL=(x,y,r)=>SC(x,y,r,r,6,.56);
function BAND(cx,cy,r1,r2){return `M${cx-r2} ${cy}A${r2} ${r2} 0 0 1 ${cx+r2} ${cy}L${cx+r1} ${cy}A${r1} ${r1} 0 0 0 ${cx-r1} ${cy}Z`;}
function HEART(cx,cy,s){return `M${cx} ${f(cy+s*.9)}C${f(cx-s*1.4)} ${cy} ${f(cx-s*.9)} ${f(cy-s)} ${cx} ${f(cy-s*.35)}C${f(cx+s*.9)} ${f(cy-s)} ${f(cx+s*1.4)} ${cy} ${cx} ${f(cy+s*.9)}Z`;}

/* ================= pictures ================= */
const PICS=[];
function pic(meta,build){const p={...meta,regions:[],lines:[],dots:[]};build((c,d)=>p.regions.push({c:c-1,d}),d=>p.lines.push(d),(fill,d)=>p.dots.push({fill,d}));PICS.push(p);}

let AC=null;

function tone(fr,t0,dur,type='sine',vol=.16){const a=ac();if(!a||!DB.sound)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);}

/* ================= picture analysis: region map + number positions ================= */
const MAP=480,MS=MAP/600;
function enc(i){return `rgb(${i},${(i*53+17)&255},${(i*97+101)&255})`;}
function analyse(p){if(p.an)return p.an;
 const cv=document.createElement('canvas');cv.width=cv.height=MAP;const g=cv.getContext('2d',{willReadFrequently:true});
 g.fillStyle='#000';g.fillRect(0,0,MAP,MAP);g.setTransform(MS,0,0,MS,0,0);g.lineJoin='round';g.lineCap='round';g.strokeStyle='#000';
 p.regions.forEach((r,i)=>{const pa=new Path2D(r.d);g.fillStyle=enc(i+1);g.fill(pa);g.lineWidth=3.4;g.stroke(pa);});
 g.lineWidth=3;p.lines.forEach(d=>g.stroke(new Path2D(d)));
 const px=g.getImageData(0,0,MAP,MAP).data,n=p.regions.length,ids=new Int16Array(MAP*MAP);
 for(let k=0;k<MAP*MAP;k++){const r=px[k*4],gg=px[k*4+1],b=px[k*4+2];ids[k]=(r>0&&r<=n&&gg===((r*53+17)&255)&&b===((r*97+101)&255))?r:0;}
 const D=new Float32Array(MAP*MAP);for(let k=0;k<D.length;k++)D[k]=ids[k]?1e6:0;
 const W=MAP,S2=1.4142;
 for(let y=0;y<W;y++)for(let x=0;x<W;x++){const k=y*W+x;if(!D[k])continue;let v=D[k];
  if(x>0)v=Math.min(v,D[k-1]+1);if(y>0){v=Math.min(v,D[k-W]+1);if(x>0)v=Math.min(v,D[k-W-1]+S2);if(x<W-1)v=Math.min(v,D[k-W+1]+S2);}D[k]=v;}
 for(let y=W-1;y>=0;y--)for(let x=W-1;x>=0;x--){const k=y*W+x;if(!D[k])continue;let v=D[k];
  if(x<W-1)v=Math.min(v,D[k+1]+1);if(y<W-1){v=Math.min(v,D[k+W]+1);if(x<W-1)v=Math.min(v,D[k+W+1]+S2);if(x>0)v=Math.min(v,D[k+W-1]+S2);}D[k]=v;}
 const L=p.regions.map(()=>({x:0,y:0,r:0,area:0}));
 for(let y=0;y<W;y++)for(let x=0;x<W;x++){const k=y*W+x,id=ids[k];if(!id)continue;const o=L[id-1];o.area++;
  const v=Math.min(D[k],x+1,y+1,W-x,W-y);if(v>o.r){o.r=v;o.x=x;o.y=y;}}
 L.forEach(o=>{o.x=(o.x+.5)/MS;o.y=(o.y+.5)/MS;o.r=o.r/MS;});
 return p.an={ids,labels:L};}

 const grid=app.querySelector('.grid');
 if(TAB==='gallery'){const done=PICS.filter(p=>K.done[p.id]).sort((a,b)=>K.done[b.id]-K.done[a.id]);
  grid.innerHTML=done.length?done.map(p=>`<button class="card" data-id="${p.id}">${picSVG(p,true)}<span class="tag done">⭐</span><span class="nm">${p.name}</span></button>`).join(''):`<div class="empty">Finish a picture and it will show up here ⭐</div>`;
  grid.querySelectorAll('.card').forEach(b=>b.onclick=()=>{sfx.tap();showViewer(PICS.find(p=>p.id===b.dataset.id));});return;}
 let list=PICS.filter(p=>TAB==='all'||p.theme===TAB);
 if(ME.age<5)list=list.slice().sort((a,b)=>a.level-b.level);
 grid.innerHTML=list.map(p=>{const pr=K.prog[p.id]||[],fs=new Set(pr),pct=Math.round(pr.length/p.regions.length*100);
  const tag=pr.length&&pct<100?`<span class="tag go">${pct}%</span>`:K.done[p.id]?`<span class="tag done">Done ⭐</span>`:`<span class="tag new">NEW</span>`;
  return `<button class="card" data-id="${p.id}">${picSVG(p,fs)}<span class="lvl">${p.level===1?'⭐':'⭐⭐'}</span>${tag}<span class="nm">${p.name}</span></button>`;}).join('');

function showViewer(p){const o=document.createElement('div');o.className='over';

async function savePNG(p){try{const S=1400;const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(picSVG(p,true,`width="${S}" height="${S}"`));
 const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
 const cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(img,0,0,S,S);
 const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const name=`${ME.name}-${p.name.replace(/\s+/g,'-')}.png`;
 const file=new File([blob],name,{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:p.name});return;}catch(e){if(e.name==='AbortError')return;}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Saved! 📸');
 }catch(e){toast('Could not save, sorry');}}

 const stage=$('#stage'),svg=stage.querySelector('svg'),world=$('#world'),rg=$('#rg'),lb=$('#lb'),fx=$('#fx'),pal=app.querySelector('.pal');
 rg.innerHTML=p.regions.map((r,i)=>`<path class="rg" d="${r.d}" fill="${filled.has(i)?p.pal[r.c]:'#fff'}"/>`).join('');
 $('#ln').innerHTML=p.lines.map(d=>`<path d="${d}"/>`).join('');

 lb.innerHTML=an.labels.map((L,i)=>`<text class="lb" x="${f(L.x)}" y="${f(L.y)}" font-size="${f(fsz[i])}">${p.regions[i].c+1}</text>`).join('');
 const els=[...rg.children],lbls=[...lb.children];
 let sel=null,s=1,tx=0,ty=0,W=0,H=0,fitS=1,hintI=0,saveT=0,anim=0;

 pal.onclick=e=>{const b=e.target.closest('.sw');if(!b||b.classList.contains('gone'))return;ac();sfx.tap();select(+b.dataset.c);};
 function ring(c){const b=swEl(c);if(b)b.style.setProperty('--p',((tot[c]-rem[c])/tot[c]*360).toFixed(1)+'deg');}
 function paintColour(c){if(c==null)return;p.regions.forEach((r,i)=>{if(r.c===c&&!filled.has(i))els[i].setAttribute('fill',c===sel?'url(#chk)':'#fff');});}
 function select(c){if(sel===c)return;const old=sel;sel=c;paintColour(old);paintColour(c);
  pal.querySelectorAll('.sw.on').forEach(b=>b.classList.remove('on'));const b=swEl(c);if(b){b.classList.add('on');ring(c);b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}hintI=0;}
 function nudge(c){const b=swEl(c);if(!b)return;b.classList.remove('nudge');void b.offsetWidth;b.classList.add('nudge');b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});sfx.nope();}

 /* filling */
 const canFill=i=>i>=0&&!filled.has(i)&&p.regions[i].c===sel;
 function idAt(wx,wy){const x=Math.floor(wx*MS),y=Math.floor(wy*MS);return(x<0||y<0||x>=MAP||y>=MAP)?0:an.ids[y*MAP+x];}
 function pick(wx,wy,tol){const cx=Math.floor(wx*MS),cy=Math.floor(wy*MS);const id0=idAt(wx,wy);if(id0&&canFill(id0-1))return id0-1;
  const R=Math.ceil(tol);let best=-1,bd=R*R+1;
  for(let dy=-R;dy<=R;dy++){const y=cy+dy;if(y<0||y>=MAP)continue;for(let dx=-R;dx<=R;dx++){const d=dx*dx+dy*dy;if(d>=bd)continue;const x=cx+dx;if(x<0||x>=MAP)continue;const id=an.ids[y*MAP+x];if(id&&canFill(id-1)){bd=d;best=id-1;}}}
  return best;}
 function ripple(x,y,col){const e=document.createElement('div');e.className='ripple';e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--c',col);stage.appendChild(e);setTimeout(()=>e.remove(),520);}
 function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{K.prog[p.id]=[...filled];saveDB();},250);}
 function fill(i,sx,sy){filled.add(i);const c=p.regions[i].c;els[i].setAttribute('fill',p.pal[c]);if(lbls[i])lbls[i].style.display='none';rem[c]--;
  ripple(sx,sy,p.pal[c]);sfx.pop();ring(c);persist();if(!rem[c])colourDone(c);}
 function colourDone(c){sfx.chime();const b=swEl(c);if(b){b.classList.remove('on');b.classList.add('gone');}
  const left=order.filter(k=>rem[k]>0);if(!left.length){sel=null;setTimeout(finished,700);return;}
  const nxt=left.find(k=>k>c);setTimeout(()=>select(nxt!=null?nxt:left[0]),380);}
 function paintAt(x,y,isTap){if(sel==null)return;const w=toWorld(x,y);const i=pick(w.x,w.y,ME.tol/s*MS);
  if(i>=0){fill(i,x,y);return;}
  if(isTap){const id=idAt(w.x,w.y);if(id&&!filled.has(id-1)&&p.regions[id-1].c!==sel)nudge(p.regions[id-1].c);}}
 function finished(){clearTimeout(saveT);delete K.prog[p.id];K.done[p.id]=Date.now();saveDB();sfx.win();confetti();
  const o=document.createElement('div');o.className='over';
  o.innerHTML=`<h2>Well done, ${ME.name}! 🎉</h2><div class="big">${picSVG(p,true)}</div><div class="btns"><button class="btn sv">💾 Save to tablet</button><button class="btn alt mp">🖼️ More pictures</button></div>`;
  app.appendChild(o);o.querySelector('.sv').onclick=()=>savePNG(p);o.querySelector('.mp').onclick=()=>goBack();}

 /* hint */
 function hint(){if(sel==null)return;ac();const list=p.regions.map((r,i)=>i).filter(i=>canFill(i)).sort((a,b)=>an.labels[a].r-an.labels[b].r);if(!list.length)return;
  const i=list[hintI++%list.length],L=an.labels[i];let ns=s;if(L.r*s<26)ns=Math.min(fitS*8,26/L.r);
  const sx=L.x*s+tx,sy=L.y*s+ty,vis=sx>70&&sx<W-70&&sy>70&&sy<H-70&&ns===s;
  if(!vis)animateTo(ns,W/2-L.x*ns,H/2-L.y*ns);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','pulse');c.setAttribute('cx',L.x);c.setAttribute('cy',L.y);
  c.setAttribute('r',Math.max(L.r*1.5,24/ns));c.setAttribute('stroke-width',7/ns);fx.appendChild(c);setTimeout(()=>c.remove(),1850);sfx.tap();}

 /* pointers: one finger/pen paints (tap or scribble), two fingers pinch-zoom & pan */
 const ptrs=new Map();let mode=null,last=null,pin=null;
 const loc=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
 function pinchStart(){const [a,b]=[...ptrs.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s,tx,ty};}
 function pinchMove(){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const wx=(pin.mx-pin.tx)/pin.s,wy=(pin.my-pin.ty)/pin.s;s=pin.s*d/pin.d;clampView();tx=mx-wx*s;ty=my-wy*s;clampView();apply();}
 stage.addEventListener('pointerdown',e=>{if(e.target.closest('.fab'))return;e.preventDefault();cancelAnimationFrame(anim);try{stage.setPointerCapture(e.pointerId);}catch(_){}ac();
  const pt=loc(e);ptrs.set(e.pointerId,pt);
  if(ptrs.size===1){mode='paint';last=pt;paintAt(pt.x,pt.y,true);}else if(ptrs.size===2){mode='pinch';pinchStart();}else mode='none';});
 stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const pt=loc(e);ptrs.set(e.pointerId,pt);
  if(mode==='paint'){const dx=pt.x-last.x,dy=pt.y-last.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));for(let k=1;k<=n;k++)paintAt(last.x+dx*k/n,last.y+dy*k/n,false);last=pt;}
  else if(mode==='pinch'&&ptrs.size===2)pinchMove();});
 const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!ptrs.size)mode=null;else if(mode==='pinch')mode='none';};
 stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
 stage.addEventListener('wheel',e=>{e.preventDefault();const pt=loc(e),w=toWorld(pt.x,pt.y);s*=Math.exp(-e.deltaY*.0015);clampView();tx=pt.x-w.x*s;ty=pt.y-w.y*s;clampView();apply();},{passive:false});
 stage.addEventListener('contextmenu',e=>e.preventDefault());
 stage.querySelector('.back').onclick=()=>{sfx.tap();goBack();};
 stage.querySelector('.hint').onclick=hint;
 stage.querySelector('.fit').onclick=()=>{sfx.tap();const v=fitView();animateTo(v.s,v.tx,v.ty);};

 cleanupPaint=()=>{ro.disconnect();cancelAnimationFrame(anim);if(saveT){clearTimeout(saveT);K.prog[p.id]=[...filled];if(K.prog[p.id].length===0||filled.size>=N)delete K.prog[p.id];saveDB();}cleanupPaint=()=>{};};
 resize();
 const first=order.find(c=>rem[c]>0);if(first!=null)select(first);else setTimeout(finished,300);}

/* ================= start ================= */
try{history.replaceState({d:0},'');}catch(e){histOK=false;}
showWho();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
